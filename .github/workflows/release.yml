name: Release

# Manual only, deliberately. No official version is ever created automatically by
# CI, and the tag trigger that used to sit here had never completed a run: every
# tagged release from v0.1.1 to v0.1.8-alpha died in "Build Rust worker" (see the
# note below that comment), and the two Windows assets a release ships — the zip and
# the setup exe — cannot be produced on an ubuntu runner at all. The release path is
# local: scripts/build-release.ps1 (or .sh), then make-installer.ps1 and
# make-setup.ps1, then `gh release create` with the artifacts and a SHA256SUMS file.
# The job below stays runnable by hand for a machine that has the runners' shape.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.9-alpha"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        # The static musl worker is part of what a release ships; without the
        # target the build script prints "skipped (target not installed)" and
        # the release goes out quietly without it (see ci.yml's package job,
        # which has carried this since the worker started shipping).
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xcut-worker-media

      - name: Build Rust worker (host)
        # The crate is a package, not a workspace: run cargo where its Cargo.toml
        # is. This is the step that killed every tag-triggered attempt from v0.1.1
        # to v0.1.8-alpha — "could not find `Cargo.toml` in
        # /home/runner/work/XCut/XCut" — which is one reason the trigger is gone.
        working-directory: crates/xcut-worker-media
        run: cargo build --release -p xcut-worker-media

      - name: Build release binaries
        # The tag string is passed verbatim, v included: that is what
        # `git describe --tags` yields, what every asset already on the release
        # page is named with, and what make-installer.ps1 / make-setup.ps1
        # expect to find in dist/. (The old `VERSION=` env prefix here was dead
        # code — the script takes its version from $1.)
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "$VERSION" dist

      - name: Smoke test artifact
        # The two worker files are asserted, not merely listed: shipping
        # "static musl worker" quietly degraded to "target not installed" is
        # exactly how this release path would fail quietly again.
        run: |
          ./dist/xcut-$VERSION-linux-amd64 version
          test -f "dist/xcut-worker-media-$VERSION-linux-amd64"
          test -f "dist/xcut-worker-media-$VERSION-host"

      - name: Create GitHub release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
