name: CI

# CI is an explicit validation tool, not an every-commit tax (Actions quota
# constraint, see docs/DECISIONS.md D11):
#   - regular development is validated by the local quality gate
#     (scripts/check.ps1 / scripts/check.sh);
#   - run this workflow manually (gh workflow run ci) before a release,
#     after large cross-platform changes, or when quota allows a re-check.
# To restore push/PR CI when quota recovers, add back:
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then
            echo "unformatted files: $unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xcut-worker-media
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xcut-worker-media
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  package:
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/xcut-worker-media
      - name: Build release artifacts (Go + Rust worker)
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh ci-test dist
      - name: Smoke test artifact
        run: |
          ./dist/xcut-ci-test-linux-amd64 version
          ./dist/xcut-worker-media-ci-test-linux-amd64 < /dev/null || true
          test -x dist/xcut-ci-test-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: xcut-binaries
          path: dist/
          retention-days: 7
