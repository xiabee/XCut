[package]
name = "xcut-worker-media"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "XCut Rust media analysis worker (JSON over stdin/stdout)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac", "mp3", "flac", "pcm", "adpcm"] }

[lib]
name = "xcut_worker_media"
path = "src/lib.rs"

[[bin]]
name = "xcut-worker-media"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
