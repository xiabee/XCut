<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xcut — local-first auto editing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>✂ xcut</h1>
  <span id="health" class="health">connecting…</span>
  <span id="banner" class="banner" hidden></span>
</header>

<main>
  <aside>
    <h2>Projects</h2>
    <form id="new-project">
      <input id="np-name" placeholder="new project name" autocomplete="off" required>
      <button type="submit">Create</button>
    </form>
    <ul id="project-list"></ul>
    <button id="delete-project" class="danger" hidden>Delete project</button>
  </aside>

  <section id="detail" class="empty">
    <p class="placeholder">Select or create a project.</p>

    <div id="project-view" hidden>
      <h2 id="project-name"></h2>

      <fieldset>
        <legend>Assets</legend>
        <form id="import-form">
          <input id="import-path" placeholder="local video path, e.g. D:\videos\match.mp4" autocomplete="off" required>
          <button type="submit">Import</button>
        </form>
        <table id="assets"><thead><tr>
          <th>file</th><th>duration</th><th>size</th><th>codec</th>
        </tr></thead><tbody></tbody></table>
      </fieldset>

      <fieldset>
        <legend>Auto edit</legend>
        <div class="row">
          <label>style <select id="style"></select></label>
          <button id="btn-analyze">1 · Analyze</button>
          <button id="btn-timeline">2 · Timeline</button>
          <button id="btn-render">3 · Render</button>
        </div>
        <p class="hint">analyze → timeline → render; every step records a job below.</p>
      </fieldset>

      <fieldset>
        <legend>Jobs</legend>
        <ul id="jobs" class="jobs"></ul>
      </fieldset>

      <fieldset>
        <legend>Result</legend>
        <video id="player" controls></video>
        <p class="hint"><a id="download" href="#" download>download mp4</a></p>
      </fieldset>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
